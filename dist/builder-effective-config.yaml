directories:
  output: dist
  buildResources: build
appId: com.genspark.budgetcsvviewer
productName: Budget CSV Viewer
files:
  - filter:
      - server.js
      - public/**/*
      - electron/**/*
      - package.json
      - node_modules/**/*
asar: true
win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
electronVersion: 37.10.3
