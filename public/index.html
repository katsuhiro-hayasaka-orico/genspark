<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予実績管理ダッシュボード</title>
  <link href="/static/vendor/offline-ui.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
  <script src="/static/vendor/chart.umd.min.js"></script>
</head>
<body data-theme="light">
  <div class="layout">
    <aside class="sidebar" id="appSidebar">
      <div class="brand">
        <div class="brand-title">
          <img src="/static/orico-logo-mark.svg" alt="株式会社オリエントコーポレーション ロゴマーク" class="brand-logo" width="40" height="40">
          <h1><span>予実績管理</span><span>ダッシュボード</span></h1>
        </div>
        <p>CSV可視化専用</p>
      </div>
      <div class="sidebar-head">
        <button id="sidebarCollapse" class="sidebar-collapse" type="button" aria-label="メニューを折りたたむ">☰</button>
      </div>
      <nav id="sidebarNav"></nav>
      <nav id="sidebarFooterNav" class="sidebar-footer-nav"></nav>
      <div class="sidebar-meta" id="sidebarMeta">未取込</div>
      <nav id="sidebarFooterNav" class="sidebar-footer-nav"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-row">
          <div class="topbar-left">
            <button id="mobileMenuToggle" class="mobile-menu-toggle" type="button" aria-label="メニューを開く" aria-controls="appSidebar" aria-expanded="false">☰</button>
            <h2 id="pageTitle">データ取込</h2>
            <span id="statusBadge" class="status">データなし</span>
          </div>
          <div class="topbar-actions">
            <div class="zoom-control" role="group" aria-label="表示倍率">
              <button id="zoomOut" class="zoom-button" type="button" aria-label="表示倍率を下げる">−</button>
              <span id="zoomValue" class="zoom-value" aria-live="polite">100%</span>
              <button id="zoomIn" class="zoom-button" type="button" aria-label="表示倍率を上げる">＋</button>
              <button id="zoomReset" class="zoom-reset" type="button">等倍</button>
            </div>
            <button id="themeToggle" class="theme-toggle" type="button">🌙 ダーク</button>
          </div>
        </div>
        <div class="topbar-filters" id="globalFilters"></div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <button id="mobileMenuBackdrop" class="mobile-menu-backdrop" type="button" aria-label="メニューを閉じる"></button>

  <script src="/static/app.js"></script>
</body>
</html>
