site_name: 予実績管理ダッシュボード ユーザーマニュアル
site_description: Budget CSV Viewer 一般利用者向けマニュアル
# This directory is generated by scripts/build_user_manual_zip.py.
# Do not point this config at docs/ directly; the public manual build must only
# receive user-facing Markdown and assets copied into this temporary directory.
docs_dir: .build/user-manual-docs
site_dir: site-user-manual

use_directory_urls: true

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

plugins:
  - search:
      lang: ja
  - glightbox:
      skip_classes:
        - no-lightbox
        - icon
        - inline-icon

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/css/custom.css

nav:
  - はじめに: index.md
  - 初回利用: getting-started.md
  - 日常操作ガイド: user-guide.md
  - 取込・出力ガイド: import-export.md
  - FAQ: faq.md
  - トラブルシューティング: troubleshooting.md
